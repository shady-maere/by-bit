<div class="auth">
  <aside class="auth-left">
    <h2 class="auth-h1">Buy &amp; sell directly with Bybit P2P</h2>
    <div class="auth-illu"><img src="assets/img/auth-p2p-card.webp" alt=""></div>
  </aside>

  <main class="auth-right">
    <div class="auth-wrap">
    <div class="auth-top">
      <a href="index.html"><img class="auth-logo" src="assets/img/auth-lightlogo.png" alt="BYBIT"></a>
      <button class="auth-globe" aria-label="Language"><svg class="ic24"><use href="#ic-globe"/></svg></button>
    </div>

    <div class="auth-card login-card">
      <div class="auth-card-h">
        <h1>Welcome to Bybit</h1>
        <a class="auth-link" href="login.html">⇄ Sign in</a>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab is-active" data-apanel="email">Email</button>
        <button class="auth-tab" data-apanel="mobile">Mobile</button>
        <button class="auth-tab" data-apanel="qr">QR Code</button>
      </div>

      <div class="auth-panel" data-panel="email">
        <div id="loginStep1">
          <input class="auth-input" id="loginEmail" type="email" placeholder="Email" aria-label="Email" autocomplete="email">
          <button class="auth-next" id="loginNext" type="button">Next</button>
        </div>
        <div id="loginStep2" hidden>
          <button class="auth-back" id="loginBack" type="button">← Back</button>
          <div class="auth-pw-email" id="loginPwEmail"></div>
          <input class="auth-input" id="loginPassword" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
          <button class="auth-next" id="loginSubmit" type="button">Log In</button>
        </div>
        <div class="auth-err" id="loginErr" role="alert"></div>
        <button class="auth-passkey" type="button" data-notice="Passkey login isn’t available here yet — use your email and password instead.">Log in with passkey</button>
      </div>
      <div class="auth-panel" data-panel="mobile" hidden>
        <div class="auth-phone">
          <div class="auth-select"><span class="auth-select-name">+1</span><svg class="ic12" style="margin-left:auto"><use href="#ic-chev"/></svg></div>
          <input class="auth-input" type="tel" placeholder="Mobile number" aria-label="Mobile number">
        </div>
        <button class="auth-next" type="button" data-notice="Mobile number login is coming soon — use Email instead.">Next</button>
        <button class="auth-passkey" type="button" data-notice="Passkey login isn’t available here yet — use your email and password instead.">Log in with passkey</button>
      </div>
      <div class="auth-panel" data-panel="qr" hidden>
        <div class="auth-qrwrap">
          <img src="assets/img/dl-qr2.png" alt="QR code">
          <p>Scan with the Bybit App to log in</p>
        </div>
      </div>

      <div class="auth-or">or log in with</div>

      <div class="auth-social">
        <button class="auth-sbtn" type="button" data-notice="Google sign-in is disabled. Only accounts registered with an email on this site can log in."><svg class="ic20"><use href="#ic-google"/></svg>Google</button>
        <button class="auth-sbtn" type="button" data-notice="Apple sign-in is coming soon."><svg class="ic20"><use href="#ic-apple"/></svg>Apple</button>
        <button class="auth-sbtn" type="button" data-notice="Telegram sign-in is coming soon."><svg class="ic20"><use href="#ic-tgram"/></svg>Telegram</button>
      </div>

      <div class="auth-div"></div>
      <a class="auth-sub" href="login.html">New to Bybit? Sign In →</a>
    </div>
    </div>
  </main>
</div>

<div class="floats floats-orange">
  <button class="float-btn" aria-label="Support"><svg class="ic18"><use href="#ic-headset"/></svg></button>
</div>

<div class="cookie" id="cookie">
  <p>This website uses cookies to improve mobile app functionality and your in-app experiences. You may review our <a href="#">Cookie Policy</a> and accept the default setting.</p>
  <button class="cookie-btn" id="cookieOk">Accept All</button>
</div>
